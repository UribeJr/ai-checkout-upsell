# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "418c7479f3f7f9b10897d05a06580bed"
application_url = "https://example.com"
embedded = true
name = "ai-checkout-upsell"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Least privilege: the upsell only reads products (catalog sync, verified facts,
# live availability). Post-purchase changesets need no Admin API scope.
scopes = "read_products"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "product-price-change"
  topic = "Product"
  actions = [ "update" ]
  triggers = [ "product.variants.price", "product.variants.compareAtPrice" ]
  uri = "/webhooks/products/update"
  query = """
  query product_variant_price_change($productId: ID!, $variantsId: ID!) {
    product(id: $productId) {
      id
      title
      status
    }
    productVariant(id: $variantsId) {
      id
      title
      price
      compareAtPrice
    }
  }
  """
  query_filter = "product.status:'ACTIVE'"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
