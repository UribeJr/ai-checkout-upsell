# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "418c7479f3f7f9b10897d05a06580bed"
application_url = "https://example.com"
embedded = true
name = "ai-checkout-upsell"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Least privilege: the upsell only reads products (catalog sync, verified facts,
# live availability). Post-purchase changesets need no Admin API scope.
scopes = "read_products"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[events]
api_version = "2026-10"

  # Product intelligence stays in step with the catalog. Only content changes
  # trigger a delivery; price and inventory edits never do (those are read live
  # at checkout). The handler re-reads the product and its content hash
  # decides whether AI enrichment runs.

  [[events.subscription]]
  handle = "catalog-product-created-deleted"
  topic = "Product"
  actions = [ "create", "delete" ]
  uri = "/webhooks/catalog/products"

  [[events.subscription]]
  handle = "catalog-product-content-updated"
  topic = "Product"
  actions = [ "update" ]
  triggers = [
    "product.title",
    "product.descriptionHtml",
    "product.productType",
    "product.tags",
    "product.status",
    "product.options.*",
    "product.metafield(namespace: 'custom', key: 'verified_facts').value",
  ]
  uri = "/webhooks/catalog/products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
